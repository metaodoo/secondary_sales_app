name: Production Release Build & Distribution

# Triggers automatically on push to 'production' branch
# or on-demand via Actions tab (workflow_dispatch).
on:
  push:
    branches:
      - production
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish GitHub Release with direct APK download links'
        type: boolean
        required: true
        default: true
      build_universal:
        description: 'Build Universal APK (runs on all Android devices)'
        type: boolean
        required: true
        default: true
      build_split_abi:
        description: 'Build Split ABI APKs (arm64-v8a & armeabi-v7a)'
        type: boolean
        required: true
        default: true
      distribute_firebase:
        description: 'Also upload to Firebase App Distribution'
        type: boolean
        required: true
        default: false

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Extract Version Info
        id: version_info
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | head -n1 | awk '{print $2}')
          VERSION_NAME=$(echo "$RAW_VERSION" | cut -d'+' -f1)
          VERSION_CODE=${{ github.run_number }}
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=v${VERSION_NAME}+${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_TITLE=Shokti+ v${VERSION_NAME} (Build ${VERSION_CODE})" >> "$GITHUB_OUTPUT"
          echo "Building Shokti+ v$VERSION_NAME (Build $VERSION_CODE)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Linter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write Signing Config
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build Universal APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_universal != 'false' }}
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version_info.outputs.VERSION_NAME }} \
            --build-number=${{ steps.version_info.outputs.VERSION_CODE }}

      - name: Build Split ABI APKs
        if: ${{ github.event_name == 'push' || github.event.inputs.build_split_abi != 'false' }}
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ steps.version_info.outputs.VERSION_NAME }} \
            --build-number=${{ steps.version_info.outputs.VERSION_CODE }}

      - name: Verify Generated Artifacts
        run: |
          echo "=== Output APK Directory ==="
          ls -lh output/apk/
          mkdir -p release_artifacts
          cp -v output/apk/Shokti*.apk release_artifacts/ 2>/dev/null || true

      - name: Compose Release Notes
        run: |
          {
            echo "## Shokti+ Mobile Application Release"
            echo ""
            echo "**Version:** \`${{ steps.version_info.outputs.VERSION_NAME }}\`"
            echo "**Build Number:** \`${{ steps.version_info.outputs.VERSION_CODE }}\`"
            echo "**Git SHA:** \`${GITHUB_SHA:0:7}\`"
            echo "**Branch:** \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "### 📥 Direct Download APK Assets"
            echo "| Variant | Architecture | Compatibility | Description |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **Universal** | Universal (Dual ARM) | 100% Android Phones | **Recommended for field users** |"
            echo "| **64-bit** | \`arm64-v8a\` | Modern Android | Smaller download size (~38 MB) |"
            echo "| **32-bit** | \`armeabi-v7a\` | Older Android Phones | Legacy device support (~33 MB) |"
            echo ""
            echo "### 📋 Recent Commits"
            git log -10 --pretty=format:'- %s (%h)'
          } > release-notes.md
          cat release-notes.md

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shokti-Plus-v${{ steps.version_info.outputs.VERSION_NAME }}-b${{ steps.version_info.outputs.VERSION_CODE }}
          path: release_artifacts/*
          retention-days: 90

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' || github.event.inputs.publish_release != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_info.outputs.TAG_NAME }}"
          TITLE="${{ steps.version_info.outputs.RELEASE_TITLE }}"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" release_artifacts/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md --latest
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_artifacts/* \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --target "${{ github.sha }}" \
              --latest
          fi

      - name: Upload to Firebase App Distribution
        if: ${{ (github.event_name == 'push' || github.event.inputs.distribute_firebase == 'true') && env.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          TESTER_GROUPS: 'testers'
        run: |
          CREDS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDS"
          trap 'rm -f "$CREDS"' EXIT

          npm install -g firebase-tools

          GOOGLE_APPLICATION_CREDENTIALS="$CREDS" firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes-file release-notes.md || echo "Firebase App Distribution completed or skipped non-critically."
