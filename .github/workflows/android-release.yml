name: Android → Firebase App Distribution

# Every push to main ships a signed release APK to Firebase App Distribution.
# Testers are alerted two ways: the App Tester app's own email/push, and the
# in-app dialog raised by AppUpdateService on next launch.
on:
  push:
    branches: [main]
    # Docs-only commits should not burn a build or spam testers with a release.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      groups:
        description: 'App Distribution tester groups (comma-separated aliases)'
        required: false
        default: 'testers'

# Two builds racing would upload out-of-order build numbers, leaving testers on
# a "newer" versionCode than the newest commit. Queue instead, and never cancel
# a run that may already have uploaded.
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  distribute:
    name: Build and distribute
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release notes are built from recent history, which needs more than
          # the default single-commit fetch.
          fetch-depth: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version this project is developed against, so CI can
          # never ship a build produced by a toolchain nobody has tested.
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # The project carries a backlog of ~69 info/warning lints, so only true
        # analyzer errors block a release.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Without it the"
            echo "::error::build would fall back to a throwaway debug key and testers"
            echo "::error::could not install the update over their existing app."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write signing config
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build release APK
        # github.run_number is monotonic per workflow, which is exactly what
        # versionCode needs: App Distribution only offers an update when the new
        # build's versionCode is higher than the installed one. The version NAME
        # still comes from pubspec.yaml — bump that by hand for a real release.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Compose release notes
        run: |
          {
            echo "Build ${{ github.run_number }} (${GITHUB_SHA:0:7}) from ${{ github.ref_name }}"
            echo ""
            git log -5 --pretty=format:'- %s'
          } > release-notes.txt
          cat release-notes.txt

      - name: Upload to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          TESTER_GROUPS: ${{ github.event.inputs.groups || 'testers' }}
        run: |
          # The CLI authenticates from a service-account file on disk. Keep it
          # out of the workspace root's tracked paths and delete it after.
          CREDS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CREDS"
          trap 'rm -f "$CREDS"' EXIT

          npm install -g firebase-tools

          GOOGLE_APPLICATION_CREDENTIALS="$CREDS" firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "$TESTER_GROUPS" \
            --release-notes-file release-notes.txt

      - name: Archive APK
        # Keeps a downloadable copy on the run itself, so a bad release can be
        # compared against or handed out directly without a rebuild.
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
